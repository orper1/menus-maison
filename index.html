<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maison</title>
<meta name="theme-color" content="#FBF7F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maison">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{--bg:#FBF7F1;--ink:#1E1B2E;--soft:#716C80;--card:#FFFFFF;--line:#EBE5DB;--seg:#F0EAE0;
--lav:#DED9FF;--lavInk:#3F33A8;--mint:#D3F1E1;--mintInk:#1A6B48;--butter:#FFEFB5;--butterInk:#7A5600;--peach:#FFDCC8;--peachInk:#9A3E14;--pink:#FFD8E6;--pinkInk:#9B2F5C;--sky:#D4E7FF;--skyInk:#1F4F8C;
--r:22px;--sh:0 2px 12px rgba(30,27,46,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1,h2,h3{font-weight:900;letter-spacing:-.01em}
button,input,textarea,select{font-family:inherit;color:var(--ink)}
button{cursor:pointer;background:none;border:none}
.view{display:none}.view.on{display:block}
header{display:flex;align-items:center;gap:12px;padding:18px 0 10px}
header .fam{width:48px;height:48px;border-radius:16px;flex:none}
header h1{font-size:26px;line-height:1.1}
header p{font-size:14px;color:var(--soft);font-weight:700}
.sync{font-size:12px!important;margin-top:1px}.sync.ok{color:var(--mintInk)!important}.sync.ko{color:var(--pinkInk)!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin:0 0 14px}
.card.tint{border-color:transparent}
.card.lav{background:var(--lav)}.card.mint{background:var(--mint)}.card.butter{background:var(--butter)}.card.peach{background:var(--peach)}.card.pink{background:var(--pink)}.card.sky{background:var(--sky)}
.card.today{border:2px solid var(--ink)}
.card.past{opacity:.5}
.head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.head svg,.head img{width:52px;height:52px;flex:none}
.head h2{font-size:20px;line-height:1.1;flex:1}
.head small{display:block;font-size:13px;color:var(--soft);font-weight:700;margin-top:2px}
.sec{font-size:17px;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.sec .n{font-size:12px;font-weight:800;background:var(--seg);border-radius:999px;padding:2px 9px;color:var(--soft)}
.seg{display:flex;background:var(--seg);border-radius:999px;padding:4px;margin:0 0 14px}
.seg button{flex:1;border-radius:999px;padding:9px 6px;font-size:14px;font-weight:800;color:var(--soft)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 6px rgba(30,27,46,.1)}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;margin:8px 0 3px}
.midi{background:var(--peach);color:var(--peachInk)}.soir{background:var(--lav);color:var(--lavInk)}.abs{background:var(--butter);color:var(--butterInk)}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px}
.tag.lav{background:var(--lav);color:var(--lavInk)}.tag.mint{background:var(--mint);color:var(--mintInk)}.tag.butter{background:var(--butter);color:var(--butterInk)}.tag.peach{background:var(--peach);color:var(--peachInk)}.tag.pink{background:var(--pink);color:var(--pinkInk)}.tag.sky{background:var(--sky);color:var(--skyInk)}.tag.ink{background:var(--ink);color:#fff}
.dish{font-size:17px;font-weight:800;line-height:1.35}
.dish.cooked{color:var(--soft)}
.dish small{display:block;font-size:13px;color:var(--soft);font-weight:700}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.btn.on{background:var(--ink);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--soft)}
.btn.prim{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:13px}
.alts{display:none;margin-top:8px;flex-direction:column;gap:6px}.alts.open{display:flex}
.alt{background:var(--bg);border:1.5px dashed var(--line);border-radius:14px;padding:9px 12px;font-size:15px;font-weight:700;text-align:left}
.alt.sel{border-style:solid;border-color:var(--ink);background:#fff}
ul.check{list-style:none}
ul.check li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px;font-weight:700}
ul.check li:last-child{border-bottom:none}
ul.check li span{flex:1;min-width:0}
ul.check input[type=checkbox],.cb{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;flex:none;display:grid;place-content:center;background:#fff;margin:0}
ul.check input:checked,.cb.on{background:var(--ink)}
ul.check input:checked::after,.cb.on::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-2px)}
ul.check li.done span{text-decoration:line-through;color:var(--soft)}
.fini{flex:none;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;color:var(--soft)}
.fini.on{background:var(--pink);color:var(--pinkInk);border-color:transparent}
.x{font-size:22px;font-weight:800;line-height:1;padding:0 6px;color:var(--soft)}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font:700 16px Nunito,sans-serif;background:#fff}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.empty{font-size:14px;color:var(--soft);font-weight:700}
.howto{font-size:13px;font-weight:700;color:var(--soft);line-height:1.45;margin:-4px 0 10px}.howto b{color:var(--ink)}
.count{font-size:13px;font-weight:800;color:var(--mintInk);background:var(--mint);border-radius:999px;padding:2px 10px;margin-left:6px}
.toast{z-index:60;position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.reset{display:block;margin:4px auto 0;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font:800 14px Nunito,sans-serif;color:var(--soft)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(251,247,241,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:150px;border-radius:16px;padding:6px 2px;font:800 12px Nunito,sans-serif;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--ink)}
nav button.on svg{color:var(--lavInk)}
/* tuiles accueil (clin d'œil Google Labs) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:132px;color:var(--ink)}
.tile svg{width:54px;height:54px}
.tile b{font-size:16px;line-height:1.15;display:block}
.tile small{font-size:13px;font-weight:700;opacity:.75;display:block;line-height:1.3}
.tile .pill{margin:0;align-self:flex-start}
.card.tap{cursor:pointer;display:block}button.card.tap{font:inherit;color:inherit}.card.tap:active{transform:scale(.99)}.head .chev{font-size:24px;color:var(--soft);margin-left:auto;padding-left:8px}
.alert{display:flex;align-items:center;gap:10px;background:var(--pink);border-radius:16px;padding:10px 12px;font-size:14px;font-weight:800;color:var(--pinkInk);margin-bottom:12px}
.alert svg{width:22px;height:22px;flex:none}
.line.tap{cursor:pointer}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:none}
.line .d{flex:none;width:46px;text-align:center;background:var(--seg);border-radius:12px;padding:5px 0;font-size:12px;font-weight:800;color:var(--soft);line-height:1.15}
.line .d b{display:block;font-size:17px;color:var(--ink)}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-size:15px;line-height:1.25}
.line .t small{display:block;font-size:12px;color:var(--soft);font-weight:700}
.line.late .d{background:var(--pink);color:var(--pinkInk)}.line.late .d b{color:var(--pinkInk)}
.line.done .t b{text-decoration:line-through;color:var(--soft)}
.prio{display:inline-flex;gap:3px}.prio i{width:7px;height:7px;border-radius:50%;background:var(--line)}.prio i.on{background:var(--ink)}
.big{width:100%;background:var(--ink);color:#fff;border-radius:999px;padding:15px;font:800 17px Nunito,sans-serif}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;font:900 30px Nunito,sans-serif;line-height:1;box-shadow:0 6px 18px rgba(30,27,46,.25);display:none}
.fab.show{display:grid;place-content:center}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}
.kpi div.hi{background:var(--mint);border-color:transparent}.kpi div.lo{background:var(--pink);border-color:transparent}
.kpi small{display:block;font-size:12px;font-weight:800;color:var(--soft)}
.kpi b{font-size:22px;line-height:1.2}
.grid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px;align-items:center}
.grid .h{font-size:11px;font-weight:800;color:var(--soft);text-align:center;line-height:1.2}
.grid .dj{font-size:14px;font-weight:800;padding-right:6px}
.grid .dj small{display:block;font-size:11px;color:var(--soft)}
.grid button{height:40px;border-radius:12px;background:var(--seg);font:800 13px Nunito,sans-serif;color:var(--soft)}
.grid button.on{background:var(--mint);color:var(--mintInk)}
.grid .dj.today,.grid .dj.today small{color:var(--lavInk)}
.wk{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wk b{flex:1;text-align:center;font-size:15px}
.wk button{width:38px;height:38px;border-radius:50%;background:var(--seg);font:800 18px Nunito,sans-serif}
/* page (sheet) */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .25s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-in{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 16px 0;min-height:100%;display:flex;flex-direction:column}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.sheet-top h2{font-size:22px;flex:1}
.back{display:flex;align-items:center;gap:2px;height:40px;padding:0 14px 0 6px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font:800 15px Nunito,sans-serif;flex:none}
.back svg{width:24px;height:24px}
.field{margin:0 0 18px}
.field p{font-size:14px;font-weight:800;margin-bottom:7px}.field p small{font-weight:700;color:var(--soft)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
.stepper button{width:46px;height:50px;background:var(--seg);font:800 22px Nunito,sans-serif;flex:none}
.stepper output{flex:1;text-align:center;font:900 20px Nunito,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff;font:800 14px Nunito,sans-serif}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.in,.sheet textarea,.sheet select{display:block;width:100%;-webkit-appearance:none;appearance:none;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;font:700 16px Nunito,sans-serif;background:#fff;color:var(--ink);min-height:46px;text-align:left}
.sheet textarea{resize:none;min-height:64px}
.switch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;font:800 15px Nunito,sans-serif}
.switch span{flex:1}
.switch i{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.switch.on i{background:var(--mintInk)}.switch.on i::after{left:23px}
.recap{background:var(--butter);border-radius:18px;padding:12px 14px;font-size:14px;font-weight:700;line-height:1.5;color:var(--butterInk)}.recap b{color:var(--ink)}
.sheet-bot{position:sticky;bottom:0;margin-top:auto;background:var(--bg);padding:12px 0 calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px}
.sheet-bot .big{flex:1;width:auto}
.danger{color:var(--pinkInk);border-color:var(--pink)}
/* splash + pull */
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .35s}
.splash.hide{opacity:0;pointer-events:none}
.splash svg{width:200px;height:200px}
.splash .pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
.splash .p0{transform-origin:center;animation-duration:.4s}.splash .p1{animation-delay:.25s}.splash .p2{animation-delay:.45s}.splash .p3{animation-delay:.7s}
.splash p{font:900 22px Nunito,sans-serif;animation:pop .4s .9s both}
.dots{display:inline-flex;gap:4px;margin-left:6px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink);animation:dot 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-5px);opacity:1}}
@media (prefers-reduced-motion:reduce){.splash *{animation:none!important}}
.ptr{position:fixed;left:50%;top:env(safe-area-inset-top);z-index:40;width:56px;height:56px;margin-left:-28px;border-radius:50%;overflow:hidden;background:#FFE3EC;box-shadow:var(--sh);transform:translateY(-90px);transition:transform .25s ease;pointer-events:none}
.ptr.drag{transition:none}.ptr img{width:100%;height:100%;display:block}
.ptr.go img{animation:hop .5s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-4px) scale(1.08)}}
</style>
</head>

<header>
<img class="fam" src="icon.svg" alt="">
<div><h1 id="hTitre">Maison</h1><p id="hSous"></p><p id="sync" class="sync">Synchro…</p></div>
</header>
<div class="card" id="codeCard" style="display:none"><h3 class="sec">Code maison</h3><p class="dish" style="font-size:15px;margin-bottom:10px">Ouvre le lien partagé par Fabien, ou colle le code ici pour synchroniser les téléphones.</p><div class="add"><input id="codeInput" placeholder="Code maison"><button class="btn" id="codeBtn">Valider</button></div></div>
<main>
<section class="view on" id="v-home"></section>
<section class="view" id="v-repas"></section>
<section class="view" id="v-agenda"></section>
<section class="view" id="v-projets"></section>
</main>
<nav>
<button class="on" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Accueil</button>
<button data-v="repas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-1 1-1 1-2M14 7c0-1 1-1 1-2"/></svg>Repas</button>

<button data-v="projets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.2 4.1 1 5.8L12 16.3 6.7 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>Projets</button>

<script>
const T0=Date.now();window.hideSplash=()=>{if(window._sp)return;window._sp=1;setTimeout(()=>{const el=document.getElementById('splash');if(!el)return;el.classList.add('hide');setTimeout(()=>el.remove(),400)},Math.max(0,1500-(Date.now()-T0)))};setTimeout(()=>window.hideSplash(),3500);
// ---------- Petits personnages
const FACE='<circle cx="46" cy="64" r="5" fill="#1E1B2E"/><circle cx="74" cy="64" r="5" fill="#1E1B2E"/><path d="M52 73 Q60 80 68 73" stroke="#1E1B2E" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="36" cy="74" rx="7" ry="4" fill="#FF9FBE"/><ellipse cx="84" cy="74" rx="7" ry="4" fill="#FF9FBE"/>';
const f=(dx,dy)=>'<g transform="translate('+dx+','+dy+')">'+FACE+'</g>';
const ICONS={
pot:'<ellipse cx="60" cy="38" rx="40" ry="10" fill="#FFD3E2"/><rect x="54" y="22" width="12" height="10" rx="4" fill="#3B2A4A"/><rect x="18" y="40" width="84" height="56" rx="18" fill="#F7A8C4"/><rect x="6" y="54" width="16" height="10" rx="5" fill="#F7A8C4"/><rect x="98" y="54" width="16" height="10" rx="5" fill="#F7A8C4"/>'+f(0,0)+'<path d="M44 18 q6 -8 0 -14 M60 16 q6 -8 0 -14 M76 18 q6 -8 0 -14" stroke="#C9B8D8" stroke-width="4" fill="none" stroke-linecap="round"/>',
pasta:'<path d="M30 52 q8 -22 16 0 q8 -22 16 0 q8 -22 16 0 q8 -22 16 0" stroke="#FFE08A" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="52" cy="40" r="6" fill="#F2685B"/><circle cx="72" cy="44" r="5" fill="#F2685B"/><path d="M12 56 H108 A48 48 0 0 1 12 56 Z" fill="#9ED9C6"/>'+f(0,14),
fish:'<ellipse cx="54" cy="62" rx="42" ry="30" fill="#8EC5FF"/><path d="M90 62 L116 40 L116 84 Z" fill="#8EC5FF"/>'+f(-6,-2),
sausage:'<rect x="10" y="38" width="100" height="48" rx="24" fill="#E8957A"/>'+f(0,-2),
soup:'<path d="M44 30 q6 -8 0 -14 M60 28 q6 -8 0 -14 M76 30 q6 -8 0 -14" stroke="#C9B8D8" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="60" cy="48" rx="48" ry="10" fill="#FFB26B"/><path d="M12 48 H108 A48 48 0 0 1 12 48 Z" fill="#FFE08A"/>'+f(0,8),
suitcase:'<path d="M44 40 V26 H76 V40" stroke="#3B2A4A" stroke-width="6" fill="none" stroke-linejoin="round"/><rect x="14" y="40" width="92" height="64" rx="16" fill="#FFB26B"/><rect x="34" y="40" width="8" height="64" fill="#F28E3A"/><rect x="78" y="40" width="8" height="64" fill="#F28E3A"/>'+f(0,6),
chicken:'<path d="M78 80 L100 102" stroke="#3B2A4A" stroke-width="3"/><circle cx="104" cy="100" r="8" fill="#FFF6EC" stroke="#3B2A4A" stroke-width="3"/><circle cx="96" cy="108" r="8" fill="#FFF6EC" stroke="#3B2A4A" stroke-width="3"/><circle cx="52" cy="54" r="40" fill="#E9A86A"/>'+f(-8,-8),
chili:'<path d="M28 40 q16 -14 36 -6" stroke="#6CC28A" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M24 44 C18 92 62 112 108 104 C82 92 72 62 64 38 C52 32 36 34 24 44 Z" fill="#F2685B"/>'+f(-14,-4),
roast:'<ellipse cx="60" cy="96" rx="52" ry="12" fill="#C9B8D8"/><rect x="16" y="40" width="88" height="56" rx="28" fill="#D98E6E"/><path d="M38 40 V96 M60 40 V96 M82 40 V96" stroke="#FFF6EC" stroke-width="4"/>'+f(0,2),
ice:'<rect x="18" y="22" width="84" height="84" rx="22" fill="#CDEBFF"/>'+f(0,2),
egg:'<ellipse cx="60" cy="62" rx="38" ry="48" fill="#FFF9F0" stroke="#3B2A4A" stroke-width="4"/>'+f(0,4)
};
const scallop=(n,r1,r2)=>{let d='';for(let i=0;i<n*2;i++){const a=Math.PI*i/n-Math.PI/2,r=i%2?r1:r2,x=60+r*Math.cos(a),y=60+r*Math.sin(a);d+=(i?' L':'M')+x.toFixed(1)+' '+y.toFixed(1)}return d+' Z'};
const SHAPES={
 blob:c=>'<path d="M62 8c30 0 50 22 50 50s-18 54-52 54S8 88 8 56 30 8 62 8z" fill="'+c+'"/>',
 flower:c=>'<path d="'+scallop(8,46,56)+'" stroke="'+c+'" stroke-width="12" stroke-linejoin="round" fill="'+c+'"/>',
 squircle:c=>'<rect x="10" y="10" width="100" height="100" rx="38" fill="'+c+'"/>',
 cloud:c=>'<circle cx="40" cy="56" r="30" fill="'+c+'"/><circle cx="78" cy="50" r="34" fill="'+c+'"/><circle cx="58" cy="78" r="30" fill="'+c+'"/><circle cx="34" cy="80" r="22" fill="'+c+'"/>',
 star:c=>'<path d="'+scallop(5,34,58)+'" stroke="'+c+'" stroke-width="16" stroke-linejoin="round" fill="'+c+'"/>',
 drop:c=>'<path d="M60 8C60 8 14 58 14 80a46 46 0 0 0 92 0C106 58 60 8 60 8z" fill="'+c+'"/>'
};
const MASCOT={home:['blob','#F7B6CF'],repas:['blob','#9EDCC0'],courses:['squircle','#FFD98A'],agenda:['flower','#B9B0FF'],rappels:['star','#FFC98A'],cantine:['drop','#9CC9FF'],projets:['blob','#FFB3A0'],budget:['cloud','#C9E7A8']};
const mascot=(k,dy)=>{const [s,c]=MASCOT[k];return '<svg viewBox="0 0 120 120" aria-hidden="true">'+SHAPES[s](c)+f(0,dy||0)+'</svg>'};
const svg=k=>'<svg viewBox="0 0 120 120" aria-hidden="true">'+(ICONS[k]||ICONS.pot)+'</svg>';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const eur=n=>(Math.round(+n||0)).toLocaleString('fr-FR')+' €';
// ---------- Dates
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=new Date();const iso=isoD(today);
const plusJ=n=>{const d=new Date();d.setDate(d.getDate()+n);return isoD(d)};
const lundi=()=>{const d=new Date();d.setDate(d.getDate()+((8-d.getDay())%7||7));return isoD(d)};
const mondayOf=v=>{const d=new Date(v+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return isoD(d)};
const addD=(v,n)=>{const d=new Date(v+'T12:00:00');d.setDate(d.getDate()+n);return isoD(d)};
const joli=v=>v?new Date(v+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}):'';
const court=v=>v?new Date(v+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}):'';
const JOURS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const dowFR=v=>(new Date(v+'T12:00:00').getDay()+6)%7;
// ---------- État synchronisé : S = état du menu en cours, M = la maison
const D=window.MENU_DATA;
const KEY='etat:'+D.titre,KEYM='maison:etat';
const S0=()=>({cook:{},swap:{},pris:{},fini:{},extra:[],beteFait:{},beteMoi:[]});
const M0=()=>({projets:[],budget:{revenus:0,charges:[],epargne:0,parMois:0},events:[],rappels:[],resa:[],cantine:{},params:{}});
let S=S0(),M=M0();
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
try{M=deep(M0(),JSON.parse(localStorage.getItem(KEYM)||'{}'))}catch(e){}
migrerResa();
function deep(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))deep(a[k],b[k]);else a[k]=b[k]}return a}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.syncSave)window.syncSave(S)};
const saveM=()=>{try{localStorage.setItem(KEYM,JSON.stringify(M))}catch(e){}if(window.syncSaveM)window.syncSaveM(M)};
window.SYNC_KEY=D.titre;window.getState=()=>S;window.getM=()=>M;
const typing=()=>{const ae=document.activeElement;return ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')&&!sheet.classList.contains('open')};
window.applyRemote=data=>{if(!data)return;S=Object.assign(S0(),data);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!typing())render()};
window.applyRemoteM=data=>{if(!data)return;M=deep(M0(),data);migrerResa();try{localStorage.setItem(KEYM,JSON.stringify(M))}catch(e){}if(!typing()&&!sheet.classList.contains('open'))render()};
const toast=t=>{const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)};
// ---------- Navigation + segments
let VIEW='home';const SEG={repas:'menus',agenda:'events'};
const seg=(v,opts)=>'<div class="seg">'+opts.map(([k,l])=>'<button data-seg="'+v+'/'+k+'" class="'+(SEG[v]===k?'on':'')+'">'+l+'</button>').join('')+'</div>';
function render(){renderHome();renderRepas();renderAgenda();renderProjets();updateFab()}
function updateFab(){const fab=document.getElementById('fab');const on=(VIEW==='agenda')||(VIEW==='projets');fab.classList.toggle('show',on);document.body.style.paddingBottom=on?'calc(160px + env(safe-area-inset-bottom))':''}
document.querySelectorAll('nav button').forEach(btn=>btn.onclick=()=>{VIEW=btn.dataset.v;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===btn));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+VIEW));updateFab();window.scrollTo(0,0);if(VIEW==='repas'&&SEG.repas==='menus'&&first)setTimeout(()=>{const el=document.getElementById('d'+first);if(el)el.scrollIntoView({block:'start'})},30)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-seg]');if(!b)return;const [v,k]=b.dataset.seg.split('/');SEG[v]=k;render()});
document.getElementById('fab').onclick=()=>{if(VIEW==='agenda'){if(SEG.agenda==='events')formEvent();else formRappel()}else formProjet()};
// ---------- Helpers menus / courses
const listeRachat=()=>{const items=[];D.courses.forEach((r,ri)=>r.items.forEach((it,ii)=>{if(S.fini[ri+'-'+ii])items.push(it)}));return items.concat(S.extra)};
const repasListe=test=>{const out=[];D.jours.forEach((j,i)=>['midi','soir'].forEach(m=>{const k=i+'-'+m;if(!j[m]||j[m]==='—'||j.absent||/^restes?\b/i.test(j[m]))return;if(test(S.cook[k],j)){const o=[j[m]].concat(j[m==='midi'?'altMidi':'altSoir']||[]);out.push({k,t:o[S.swap[k]||0],j})}}));return out};
const pasCuisine=()=>[...new Set(repasListe(v=>v==='non').map(x=>x.t))];
const aConfirmer=()=>repasListe((v,j)=>v===undefined&&j.date<iso);
const dejaCuisine=()=>{const out=[];D.jours.forEach((j,i)=>['midi','soir'].forEach(m=>{const k=i+'-'+m;if(S.cook[k]===true){const o=[j[m]].concat(j[m==='midi'?'altMidi':'altSoir']||[]);out.push(o[S.swap[k]||0])}}));return [...new Set(out)]};
const platDu=(j,i,kind)=>{const base=j[kind];if(!base||base==='—')return null;const o=[base].concat(j[kind==='midi'?'altMidi':'altSoir']||[]);return {t:o[S.swap[i+'-'+kind]||0],cooked:!!S.cook[i+'-'+kind]}};
// ---------- Rappels calculés (cantine à réserver, etc.)
const semKey=v=>mondayOf(v);
// Réservations : cantine, garderie, centres de vacances… chacune avec une date de couverture ou une date limite.
function migrerResa(){if(!Array.isArray(M.resa))M.resa=[];const c=M.cantine;
  if(c&&c.jusqu&&!M.resa.some(r=>r.cant)){M.resa.push({id:uid(),cant:1,t:'Cantine & garderie'+(c.enfant?' · '+c.enfant:''),jusqu:c.jusqu,avant:'',marge:+c.marge||7,fait:false})}
  if(!M.resa.length)M.resa=[{id:uid(),cant:1,t:'Cantine & garderie',jusqu:'',avant:'',marge:7,fait:false}]}
const resaKo=r=>{const m=+r.marge||7;if(r.avant&&!r.fait&&r.avant<plusJ(m))return 'À réserver avant le '+court(r.avant);if(r.jusqu&&r.jusqu<plusJ(m))return (r.jusqu<iso?'Expiré le ':'Couvert jusqu’au ')+court(r.jusqu);return ''};
const resaEtat=r=>{if(r.avant&&!r.fait)return (r.avant<iso?'En retard · ':'')+'À réserver avant le '+court(r.avant);if(r.jusqu)return (r.jusqu<iso?'Expiré le ':'Jusqu’au ')+court(r.jusqu);return r.fait?'Réservé':'À renseigner'};
const resaAlertes=()=>(M.resa||[]).map(r=>{const k=resaKo(r);return k?r.t+' : '+k.toLowerCase():null}).filter(Boolean);
const resaResume=()=>{const al=resaAlertes();if(al.length)return al.length+' à faire';const r=(M.resa||[]).filter(x=>x.jusqu).sort((a,b)=>a.jusqu<b.jusqu?-1:1)[0];return r?'Jusqu’au '+court(r.jusqu):'À renseigner'};

const rappelsDus=()=>M.rappels.filter(r=>!r.fait&&r.date&&r.date<=iso).sort((a,b)=>a.date<b.date?-1:1);
const eventsJour=v=>M.events.filter(e=>e.date===v).sort((a,b)=>(a.heure||'')<(b.heure||'')?-1:1);
// ---------- ACCUEIL
function renderHome(){
  document.getElementById('hSous').textContent=joli(iso).replace(/^./,c=>c.toUpperCase());
  let h='';
  resaAlertes().forEach(a=>h+='<div class="alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>'+esc(a)+'</div>');
  const dus=rappelsDus();if(dus.length)h+='<div class="alert" style="background:var(--butter);color:var(--butterInk)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0v5l2 3H4l2-3z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>'+dus.length+' rappel'+(dus.length>1?'s':'')+' à faire : '+esc(dus.map(r=>r.t).slice(0,2).join(', '))+(dus.length>2?'…':'')+'</div>';
  const ac=aConfirmer();if(ac.length)h+='<div class="card tint butter"><h3 class="sec">Vous avez cuisiné ? <span class="n">'+ac.length+'</span></h3><p class="howto" style="margin:0 0 6px;color:var(--butterInk)">Ce qui n’a pas été fait pourra être reproposé au prochain menu.</p>'+ac.map(x=>'<div class="line"><div class="t"><b>'+esc(x.t)+'</b><small>'+esc(x.j.label)+'</small></div><button class="btn sm" data-cook="'+x.k+'">✓ Oui</button><button class="btn sm ghost" data-nocook="'+x.k+'">✕ Non</button></div>').join('')+'</div>';
  // Repas du jour
  const ji=D.jours.findIndex(j=>j.date===iso);const j=D.jours[ji];
  let repas='';
  if(j&&j.absent)repas='<p class="dish">'+esc(j.note||'Absents aujourd’hui')+'</p>';
  else if(j){['midi','soir'].forEach(k=>{const p=platDu(j,ji,k);if(p)repas+='<span class="pill '+k+'">'+(k==='midi'?'Midi':'Ce soir')+'</span><p class="dish'+(p.cooked?' cooked':'')+'">'+(p.cooked?'✓ ':'')+esc(p.t)+'</p>'})}
  else repas='<p class="empty">Pas de menu prévu aujourd’hui. Onglet Repas → Nouveau menu.</p>';
  h+='<div class="card tap" data-go="repas/menus" role="button"><div class="head">'+mascot('repas')+'<div><h2>Au menu</h2><small>'+esc(D.titre)+'</small></div><b class="chev">›</b></div>'+repas+'</div>';
  // Aujourd'hui
  const ev=eventsJour(iso),dem=eventsJour(plusJ(1));
  h+='<div class="card tap" data-go="agenda/events" role="button"><div class="head">'+mascot('agenda')+'<div><h2>Aujourd’hui</h2><small>'+(ev.length?ev.length+' événement'+(ev.length>1?'s':''):'Rien de prévu')+'</small></div><b class="chev">›</b></div>';
  h+=ev.map(e=>evLine(e)).join('');
  if(dem.length)h+='<p class="howto" style="margin:10px 0 0"><b>Demain :</b> '+esc(dem.map(e=>(e.heure?e.heure+' ':'')+e.t).join(' · '))+'</p>';
  h+='</div>';
  // Tuiles
  const rach=listeRachat().length,projs=M.projets.filter(p=>p.statut!=='fait'),top=projs.sort((a,b)=>(b.prio||0)-(a.prio||0))[0];
  const bud=budgetCalc();
  h+='<div class="tiles">'+
  '<button class="tile" style="background:var(--butter)" data-go="repas/courses">'+mascot('courses')+'<span><b>Courses</b><small>'+(rach?rach+' à racheter':'Rien à racheter')+'</small></span></button>'+
  '<button class="tile" style="background:var(--lav)" data-go="projets/x">'+mascot('projets')+'<span><b>Projets</b><small>'+(top?'Priorité : '+esc(top.t):projs.length+' en cours')+'</small></span></button>'+
  '<button class="tile" data-go="agenda/events" style="background:var(--sky)">'+mascot('cantine')+'<span><b>Réservations</b><small>'+esc(resaResume())+'</small></span></button>'+
  '<button class="tile" style="background:var(--mint)" data-go="projets/x">'+mascot('budget')+'<span><b>Budget</b><small>'+(bud.ok?'Reste à vivre '+eur(bud.reste):'À remplir')+'</small></span></button>'+
  '</div>';
  document.getElementById('v-home').innerHTML=h;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-cook],[data-nocook]');if(!b)return;if(b.dataset.cook){const k=b.dataset.cook;S.cook[k]=S.cook[k]===true?undefined:true;if(S.cook[k]===undefined)delete S.cook[k]}else{const k=b.dataset.nocook;S.cook[k]=S.cook[k]==='non'?undefined:'non';if(S.cook[k]===undefined)delete S.cook[k]}save();render()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;const inner=e.target.closest('button');if(inner&&inner!==b)return;const [v,k]=b.dataset.go.split('/');if(SEG[v]!==undefined)SEG[v]=k;document.querySelector('nav button[data-v='+v+']').click();render()});
// ---------- REPAS
let first=null;
function meal(j,i,kind){
  const base=j[kind];if(!base||base==='—')return '<span class="pill '+kind+'">'+(kind==='midi'?'Midi':'Soir')+'</span><p class="dish">—</p>';
  const alts=j[kind==='midi'?'altMidi':'altSoir']||[];const opts=[base].concat(alts);
  const k=i+'-'+kind;const sel=S.swap[k]||0;const cooked=S.cook[k]===true,non=S.cook[k]==='non',past=j.date<iso&&S.cook[k]===undefined;
  let h='<span class="pill '+kind+'">'+(kind==='midi'?'Midi':'Soir')+'</span>'+(past?'<span class="tag butter" style="margin-left:6px">À confirmer</span>':non?'<span class="tag pink" style="margin-left:6px">Pas fait</span>':'')+'<p class="dish'+(cooked||non?' cooked':'')+'">'+(cooked?'✓ ':non?'✕ ':'')+esc(opts[sel]||base)+(sel?'<small>Changé (prévu : '+esc(base)+')</small>':'')+'</p>';
  h+='<div class="acts"><button class="btn sm'+(cooked?' on':'')+'" data-cook="'+k+'">'+(cooked?'Cuisiné ✓':'Cuisiné')+'</button><button class="btn sm'+(non?' on':' ghost')+'" data-nocook="'+k+'">'+(non?'Pas fait ✕':'Pas fait')+'</button>';
  if(alts.length)h+='<button class="btn sm ghost" data-toggle="'+k+'">Changer</button>';
  h+='</div>';
  if(alts.length)h+='<div class="alts" id="alts-'+k+'">'+opts.map((o,n)=>'<button class="alt'+(n===sel?' sel':'')+'" data-swap="'+k+'" data-n="'+n+'">'+(n===0?'Prévu : ':'')+esc(o)+'</button>').join('')+'</div>';
  return h;
}
function renderRepas(){
  let h=seg('repas',[['menus','Menus'],['courses','Courses']]);
  if(SEG.repas==='menus'){
    h+='<button class="card tint mint" style="width:100%;text-align:left;display:flex;align-items:center;gap:12px" id="openMenu">'+mascot('repas').replace('<svg','<svg style="width:56px;height:56px;flex:none"')+'<span style="flex:1"><b style="font-size:17px;display:block">Nouveau menu</b><small style="font-weight:700;color:var(--mintInk)">'+esc(D.titre)+' · préparer la suite avec Claude</small></span><b style="font-size:24px">›</b></button>';
    first=null;
    D.jours.forEach((j,i)=>{const past=j.date<iso;const isToday=j.date===iso;if(!past&&first===null)first=i;
    h+='<article class="card'+(isToday?' today':'')+(past?' past':'')+(j.absent?' tint butter':'')+'" id="d'+i+'"><div class="head">'+svg(j.icon)+'<div><h2>'+esc(j.label)+'</h2>'+(isToday?'<small>Aujourd’hui</small>':'')+'</div></div>'+

    if(b.id==='ics'){downloadICS(E);return false}
    if(b.id==='del'){M.events=M.events.filter(x=>x.id!==E.id);saveM();closeSheet();return false}
    if(b.id==='ok'){E.t=g('eT').value.trim();E.date=g('eD').value;E.heure=g('eH').value;E.lieu=g('eL').value.trim();E.note=g('eN').value.trim();if(!E.t||!E.date){toast('Titre et date');return false}
      const i=M.events.findIndex(x=>x.id===E.id);if(i<0)M.events.push(E);else M.events[i]=E;saveM();closeSheet();toast(ev?'Modifié':'Ajouté à l’agenda');return false}
    return false}});
}
function downloadICS(E){const dt=E.date.replace(/-/g,'');const hm=(E.heure||'09:00').replace(':','');const end=String(+hm.slice(0,2)+1).padStart(2,'0')+hm.slice(2);
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Maison//FR','BEGIN:VEVENT','UID:'+E.id+'@maison','DTSTAMP:'+dt+'T000000','DTSTART:'+dt+'T'+hm+'00','DTEND:'+dt+'T'+end+'00','SUMMARY:'+E.t.replace(/,/g,'\\,'),E.lieu?'LOCATION:'+E.lieu.replace(/,/g,'\\,'):'',E.note?'DESCRIPTION:'+E.note.replace(/\n/g,'\\n'):'',E.rappel?'BEGIN:VALARM\r\nTRIGGER:-P1D\r\nACTION:DISPLAY\r\nDESCRIPTION:'+E.t+'\r\nEND:VALARM':'','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download=E.t.replace(/[^\w]+/g,'-')+'.ics';document.body.appendChild(a);a.click();a.remove();toast('Ouvre le fichier → Ajouter au calendrier')}

(()=>{const ptr=document.getElementById('ptr');const on=window.PTR_FORCE||navigator.standalone||matchMedia('(display-mode: standalone)').matches;if(!on)return;
let y0=null,d=0;const MAX=120,GO=85;
addEventListener('touchstart',e=>{y0=(scrollY<=0&&!sheet.classList.contains('open')&&!document.getElementById('splash'))?e.touches[0].clientY:null;d=0},{passive:true});
addEventListener('touchmove',e=>{if(y0===null)return;d=Math.min(Math.max(0,(e.touches[0].clientY-y0)*.5),MAX);ptr.classList.add('drag');ptr.style.transform='translateY('+(d-80)+'px) scale('+(.6+d/300).toFixed(2)+')';ptr.classList.toggle('go',d>=GO)},{passive:true});
addEventListener('touchend',()=>{if(y0===null)return;y0=null;ptr.classList.remove('drag');if(d>=GO){ptr.classList.add('go');ptr.style.transform='translateY(24px)';setTimeout(()=>location.reload(),450)}else{ptr.style.transform=''}});
})();

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAGyeKLg5WdhMSB5dn_phmJ95PjggnyVxY",
  authDomain: "menus-maison-9efcf.firebaseapp.com",
  projectId: "menus-maison-9efcf",
  storageBucket: "menus-maison-9efcf.firebasestorage.app",
  messagingSenderId: "11264621459",
  appId: "1:11264621459:web:85a3c65364316ddc854666"
};
const status = (t, cls) => { const el = document.getElementById('sync'); el.textContent = t; el.className = 'sync ' + (cls || ''); };
// Le code maison vient du lien (#m=...) ou de la saisie, puis reste sur le téléphone. Il n'est jamais dans le dépôt.
const m = new URLSearchParams(location.hash.slice(1)).get('m');
if (m) { try { localStorage.setItem('maison', m) } catch (e) {} history.replaceState(null, '', location.pathname); }
let code = null; try { code = localStorage.getItem('maison') } catch (e) {}
const card = document.getElementById('codeCard');
document.getElementById('codeBtn').onclick = () => { const v = document.getElementById('codeInput').value.trim(); if (!v) return; try { localStorage.setItem('maison', v) } catch (e) {} location.reload(); };
if (!code) { card.style.display = 'block'; status('Pas synchronisé : code maison manquant', 'ko'); window.hideSplash(); }
else {
  const db = getFirestore(initializeApp(firebaseConfig));
  const refS = doc(db, 'maisons', code, 'etat', window.SYNC_KEY.replace(/[\/]/g, '-'));
  const refM = doc(db, 'maisons', code, 'etat', 'maison');
  const push = (ref, data) => setDoc(ref, JSON.parse(JSON.stringify(data))).then(() => status('Synchronisé ✓', 'ok')).catch(() => status('Hors ligne : sera envoyé plus tard', 'ko'));
  let t1 = null, t2 = null, f1 = true, f2 = true;
  window.syncSave = S => { clearTimeout(t1); t1 = setTimeout(() => push(refS, S), 400); };
  window.syncSaveM = M => { clearTimeout(t2); t2 = setTimeout(() => push(refM, M), 400); };
  const fail = () => { status('Code maison refusé ou hors ligne', 'ko'); card.style.display = 'block'; window.hideSplash(); };
  onSnapshot(refS, snap => { if (snap.exists()) window.applyRemote(snap.data()); else if (f1) window.syncSave(window.getState()); f1 = false; status('Synchronisé ✓', 'ok'); window.hideSplash(); }, fail);
  onSnapshot(refM, snap => { if (snap.exists()) window.applyRemoteM(snap.data()); else if (f2) window.syncSaveM(window.getM()); f2 = false; }, fail);
  const colI = collection(db, 'maisons', code, 'inspi');
  window.FB = { saveInspi: it => setDoc(doc(colI, it.id), JSON.parse(JSON.stringify(it))).catch(() => status('Hors ligne : sera envoyé plus tard', 'ko')), delInspi: id => deleteDoc(doc(colI, id)).catch(() => {}) };
  onSnapshot(colI, snap => { window.applyInspi(snap.docs.map(d => d.data())); }, () => {});
}
</script>
