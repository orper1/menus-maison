<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menus maison</title>
<meta name="theme-color" content="#FFF6EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Menus">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{--bg:#FFF6EC;--ink:#3B2A4A;--soft:#6B5A7B;--card:#FFFDF8;--pink:#FFE3EC;--pinkInk:#8A2E52;--mint:#D8F2E9;--mintInk:#1F5E4E;--butter:#FFF1C9;--butterInk:#7A4A00;--line:#EADCE4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600}
button{font-family:Nunito,sans-serif;color:var(--ink);cursor:pointer}
header{padding:20px 0 12px;display:flex;align-items:center;gap:12px}
header h1{font-size:24px;line-height:1.15}
header p{font-size:14px;color:var(--soft);font-weight:700}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:16px;box-shadow:0 6px 0 var(--ink);margin:0 0 18px}
.card.today{background:#FFFFFF;border-width:4px}
.card.past{opacity:.55}
.card.absent{background:var(--butter)}
.head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.head svg{width:64px;height:64px;flex:none}
.head h2{font-size:24px;line-height:1.1}
.badge{display:inline-block;font-size:12px;font-weight:800;background:var(--ink);color:#FFF6EC;border-radius:999px;padding:3px 10px;margin-top:4px}
.pill{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;padding:3px 12px;margin:10px 0 4px}
.midi{background:var(--pink);color:var(--pinkInk)}.soir{background:var(--mint);color:var(--mintInk)}.abs{background:#FFE08A;color:var(--butterInk)}
.dish{font-size:18px;font-weight:700;line-height:1.35}
.dish.cooked{color:var(--soft)}
.dish small{display:block;font-size:13px;color:var(--soft);font-weight:700}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:800}
.btn.on{background:#9ED9C6;color:var(--mintInk)}
.alts{display:none;margin-top:8px;flex-direction:column;gap:6px}
.alts.open{display:flex}
.alt{background:var(--bg);border:2px dashed var(--ink);border-radius:14px;padding:8px 12px;font-size:15px;font-weight:700;text-align:left}
.alt.sel{border-style:solid;background:var(--pink)}
.sec{font-size:20px;margin:6px 0 10px}
ul.check{list-style:none}
ul.check li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:2px dashed var(--line);font-size:16px;font-weight:700}
ul.check li:last-child{border-bottom:none}
ul.check li span{flex:1}
ul.check input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:3px solid var(--ink);border-radius:9px;flex:none;display:grid;place-content:center;background:#fff}
ul.check input:checked{background:#9ED9C6}
ul.check input:checked::after{content:"";width:8px;height:14px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
ul.check li.done span{text-decoration:line-through;color:var(--soft)}
.fini{flex:none;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
.fini.on{background:#FFB3C9;color:var(--pinkInk)}
.racheter{background:var(--pink)}
.racheter ul{list-style:none}
.racheter li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed #F2C6D6;font-size:16px;font-weight:700}
.racheter li span{flex:1}
.x{background:none;border:none;font-size:22px;font-weight:800;line-height:1;padding:0 6px}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:14px;padding:8px 12px;font:700 16px Nunito,sans-serif;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.empty{font-size:15px;color:var(--pinkInk);font-weight:700}
.toast{z-index:60;position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#FFF6EC;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:800;color:var(--soft)}
.form label.full{grid-column:1/-1}
.form label.chk{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
.form input:not([type=checkbox]){border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font:700 16px Nunito,sans-serif;background:#fff;color:var(--ink);width:100%;min-width:0}
.form input[type=checkbox]{width:22px;height:22px;accent-color:#3B2A4A}
.hint{font-size:13px;color:var(--soft);font-weight:700;margin-top:8px}
.sync{font-size:12px!important;margin-top:2px}.sync.ok{color:var(--mintInk)!important}.sync.ko{color:var(--pinkInk)!important}
.cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--mint);border:3px solid var(--ink);border-radius:26px;padding:14px 16px;box-shadow:0 6px 0 var(--ink);margin:0 0 18px}
.cta svg{width:56px;height:56px;flex:none}
.cta b{display:block;font:600 21px Fredoka,Nunito,sans-serif}
.cta small{display:block;font-size:14px;font-weight:700;color:var(--mintInk)}
.cta i{margin-left:auto;font-style:normal;font-size:26px;font-weight:800}
.howto{font-size:14px;font-weight:700;color:var(--soft);line-height:1.45;margin:-2px 0 10px}
.howto b{color:var(--ink)}
.count{font-size:14px;font-weight:800;color:var(--mintInk);background:var(--mint);border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .25s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-in{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 16px 0;min-height:100%;display:flex;flex-direction:column}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.sheet-top h2{font-size:24px;flex:1}
.back{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;font:800 22px Nunito,sans-serif;line-height:1}
.field{margin:0 0 20px}
.field p{font-size:15px;font-weight:800;margin-bottom:8px}
.field p small{font-weight:700;color:var(--soft)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:flex;align-items:center;border:3px solid var(--ink);border-radius:18px;background:#fff;overflow:hidden}
.stepper button{width:48px;height:52px;border:none;background:var(--pink);font:800 24px Nunito,sans-serif;flex:none}
.stepper output{flex:1;text-align:center;font:600 22px Fredoka,Nunito,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:8px 14px;background:#fff;font:800 15px Nunito,sans-serif}
.chip.on{background:var(--ink);color:#FFF6EC}
.datein{display:block;width:100%;margin-top:10px;-webkit-appearance:none;appearance:none;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font:700 16px Nunito,sans-serif;background:#fff;color:var(--ink);min-height:46px;text-align:left}
.sheet textarea{display:block;width:100%;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font:700 16px Nunito,sans-serif;background:#fff;color:var(--ink);resize:none;min-height:64px}
.switch{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:12px 14px;font:800 15px Nunito,sans-serif}
.switch span{flex:1}
.switch i{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-sizing:border-box;transition:left .2s}
.switch.on i{background:#9ED9C6}.switch.on i::after{left:23px}
.recap{background:var(--butter);border:2px dashed var(--butterInk);border-radius:18px;padding:12px 14px;font-size:14px;font-weight:700;line-height:1.5;color:var(--butterInk)}
.recap b{color:var(--ink)}
.sheet-bot{position:sticky;bottom:0;margin-top:auto;background:var(--bg);padding:12px 0 calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px}
.big{flex:1;background:var(--ink);color:#FFF6EC;border:none;border-radius:999px;padding:15px;font:800 17px Nunito,sans-serif}
.sheet-bot .btn{padding:0 16px}
ul.plain{padding-left:20px}ul.plain li{font-size:17px;font-weight:700;line-height:1.5;margin:4px 0}
.reset{display:block;margin:4px auto 0;background:none;border:2px solid var(--ink);border-radius:999px;padding:8px 16px;font:800 14px Nunito,sans-serif;color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;background:#FFFDF8;border-top:3px solid var(--ink);display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:180px;background:none;border:none;border-radius:16px;padding:8px 4px;font:800 13px Nunito,sans-serif;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:28px;height:28px}
nav button.on{background:var(--pink);color:var(--pinkInk)}
</style>
</head>
<body>
<header>
<svg viewBox="0 0 120 120" width="52" height="52" aria-hidden="true" id="logo"></svg>
<div><h1 id="titre"></h1><p id="sous"></p><p id="sync" class="sync">Synchro…</p></div>
</header>
<div class="card" id="codeCard" style="display:none"><h3 class="sec">Code maison</h3><p class="dish" style="font-size:15px;margin-bottom:10px">Ouvre le lien partagé par Fabien, ou colle le code ici pour synchroniser les téléphones.</p><div class="add"><input id="codeInput" placeholder="Code maison"><button class="btn" id="codeBtn">Valider</button></div></div>
<main>
<section class="view on" id="v-menus"></section>
<section class="view" id="v-courses"></section>
<section class="view" id="v-bete"></section>
</main>
<nav>
<button class="on" data-v="menus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-1 1-1 1-2M14 7c0-1 1-1 1-2"/></svg>Menus</button>
<button data-v="courses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h2l2.5 10h10L20 8H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>Courses</button>
<button data-v="bete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Pense-bête</button>
</nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Nouveau menu"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
const FACE='<circle cx="46" cy="64" r="5" fill="#3B2A4A"/><circle cx="74" cy="64" r="5" fill="#3B2A4A"/><path d="M52 73 Q60 80 68 73" stroke="#3B2A4A" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="36" cy="74" rx="7" ry="4" fill="#FF8FB1"/><ellipse cx="84" cy="74" rx="7" ry="4" fill="#FF8FB1"/>';
const f=(dx,dy)=>'<g transform="translate('+dx+','+dy+')">'+FACE+'</g>';
const ICONS={
pot:'<ellipse cx="60" cy="38" rx="40" ry="10" fill="#FFD3E2"/><rect x="54" y="22" width="12" height="10" rx="4" fill="#3B2A4A"/><rect x="18" y="40" width="84" height="56" rx="18" fill="#F7A8C4"/><rect x="6" y="54" width="16" height="10" rx="5" fill="#F7A8C4"/><rect x="98" y="54" width="16" height="10" rx="5" fill="#F7A8C4"/>'+f(0,0)+'<path d="M44 18 q6 -8 0 -14 M60 16 q6 -8 0 -14 M76 18 q6 -8 0 -14" stroke="#C9B8D8" stroke-width="4" fill="none" stroke-linecap="round"/>',
pasta:'<path d="M30 52 q8 -22 16 0 q8 -22 16 0 q8 -22 16 0 q8 -22 16 0" stroke="#FFE08A" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="52" cy="40" r="6" fill="#F2685B"/><circle cx="72" cy="44" r="5" fill="#F2685B"/><path d="M12 56 H108 A48 48 0 0 1 12 56 Z" fill="#9ED9C6"/>'+f(0,14),
fish:'<ellipse cx="54" cy="62" rx="42" ry="30" fill="#8EC5FF"/><path d="M90 62 L116 40 L116 84 Z" fill="#8EC5FF"/>'+f(-6,-2),
sausage:'<rect x="10" y="38" width="100" height="48" rx="24" fill="#E8957A"/>'+f(0,-2),
soup:'<path d="M44 30 q6 -8 0 -14 M60 28 q6 -8 0 -14 M76 30 q6 -8 0 -14" stroke="#C9B8D8" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="60" cy="48" rx="48" ry="10" fill="#FFB26B"/><path d="M12 48 H108 A48 48 0 0 1 12 48 Z" fill="#FFE08A"/>'+f(0,8),
suitcase:'<path d="M44 40 V26 H76 V40" stroke="#3B2A4A" stroke-width="6" fill="none" stroke-linejoin="round"/><rect x="14" y="40" width="92" height="64" rx="16" fill="#FFB26B"/><rect x="34" y="40" width="8" height="64" fill="#F28E3A"/><rect x="78" y="40" width="8" height="64" fill="#F28E3A"/>'+f(0,6),
chicken:'<path d="M78 80 L100 102" stroke="#3B2A4A" stroke-width="3"/><circle cx="104" cy="100" r="8" fill="#FFF6EC" stroke="#3B2A4A" stroke-width="3"/><circle cx="96" cy="108" r="8" fill="#FFF6EC" stroke="#3B2A4A" stroke-width="3"/><circle cx="52" cy="54" r="40" fill="#E9A86A"/>'+f(-8,-8),
chili:'<path d="M28 40 q16 -14 36 -6" stroke="#6CC28A" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M24 44 C18 92 62 112 108 104 C82 92 72 62 64 38 C52 32 36 34 24 44 Z" fill="#F2685B"/>'+f(-14,-4),
roast:'<ellipse cx="60" cy="96" rx="52" ry="12" fill="#C9B8D8"/><rect x="16" y="40" width="88" height="56" rx="28" fill="#D98E6E"/><path d="M38 40 V96 M60 40 V96 M82 40 V96" stroke="#FFF6EC" stroke-width="4"/>'+f(0,2),
ice:'<rect x="18" y="22" width="84" height="84" rx="22" fill="#CDEBFF"/>'+f(0,2),
egg:'<ellipse cx="60" cy="62" rx="38" ry="48" fill="#FFF9F0" stroke="#3B2A4A" stroke-width="4"/>'+f(0,4)
};
const svg=k=>'<svg viewBox="0 0 120 120" aria-hidden="true">'+(ICONS[k]||ICONS.pot)+'</svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=window.MENU_DATA;
const KEY='etat:'+D.titre;
let S={cook:{},swap:{},pris:{},fini:{},extra:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.syncSave)window.syncSave(S)};
window.SYNC_KEY=D.titre;
window.applyRemote=data=>{if(!data)return;const ae=document.activeElement;const typing=ae&&ae.tagName==='INPUT'&&ae.closest('#v-courses');S=Object.assign({cook:{},swap:{},pris:{},fini:{},extra:[]},data);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}renderMenus();if(!typing)renderCourses()};
window.getState=()=>S;
const toast=t=>{const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)};
document.getElementById('logo').innerHTML=ICONS.pot;
document.getElementById('titre').textContent=D.titre;
document.getElementById('sous').textContent=D.sousTitre;

const today=new Date();const iso=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
let first=null;
function meal(j,i,kind){
  const base=j[kind];if(!base||base==='—')return '<span class="pill '+kind+'">'+(kind==='midi'?'Midi':'Soir')+'</span><p class="dish">—</p>';
  const alts=j[kind==='midi'?'altMidi':'altSoir']||[];const opts=[base].concat(alts);
  const k=i+'-'+kind;const sel=S.swap[k]||0;const cooked=!!S.cook[k];
  let h='<span class="pill '+kind+'">'+(kind==='midi'?'Midi':'Soir')+'</span><p class="dish'+(cooked?' cooked':'')+'">'+(cooked?'✓ ':'')+esc(opts[sel]||base)+(sel?'<small>Changé (prévu : '+esc(base)+')</small>':'')+'</p>';
  h+='<div class="acts"><button class="btn'+(cooked?' on':'')+'" data-cook="'+k+'">'+(cooked?'Cuisiné ✓':'Cuisiné ?')+'</button>';
  if(alts.length)h+='<button class="btn" data-toggle="'+k+'">Changer</button>';
  h+='</div>';
  if(alts.length)h+='<div class="alts" id="alts-'+k+'">'+opts.map((o,n)=>'<button class="alt'+(n===sel?' sel':'')+'" data-swap="'+k+'" data-n="'+n+'">'+(n===0?'Prévu : ':'')+esc(o)+'</button>').join('')+'</div>';
  return h;
}
function renderMenus(){
  let h='';first=null;
  D.jours.forEach((j,i)=>{const past=j.date<iso;const isToday=j.date===iso;if(!past&&first===null)first=i;
  h+='<article class="card'+(isToday?' today':'')+(past?' past':'')+(j.absent?' absent':'')+'" id="d'+i+'"><div class="head">'+svg(j.icon)+'<div><h2>'+esc(j.label)+'</h2>'+(isToday?'<span class="badge">Aujourd’hui</span>':'')+'</div></div>'+
  (j.absent?'<span class="pill abs">Absents</span><p class="dish">'+esc(j.note||'')+'</p>':meal(j,i,'midi')+meal(j,i,'soir'))+'</article>'});
  document.getElementById('v-menus').innerHTML=h;
}
const vm=document.getElementById('v-menus');
vm.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.cook){const k=b.dataset.cook;S.cook[k]=!S.cook[k];save();renderMenus();}
  else if(b.dataset.toggle){document.getElementById('alts-'+b.dataset.toggle).classList.toggle('open')}
  else if(b.dataset.swap){S.swap[b.dataset.swap]=+b.dataset.n;save();renderMenus();toast('Recette changée')}
});

const listeRachat=()=>{const items=[];D.courses.forEach((r,ri)=>r.items.forEach((it,ii)=>{if(S.fini[ri+'-'+ii])items.push(it)}));return items.concat(S.extra)};
const dejaCuisine=()=>{const out=[];D.jours.forEach((j,i)=>['midi','soir'].forEach(m=>{const k=i+'-'+m;if(S.cook[k]){const o=[j[m]].concat(j[m==='midi'?'altMidi':'altSoir']||[]);out.push(o[S.swap[k]||0])}}));return [...new Set(out)]};
const SPARK='<svg viewBox="0 0 120 120" aria-hidden="true"><rect x="16" y="20" width="88" height="88" rx="24" fill="#FFFDF8" stroke="#3B2A4A" stroke-width="5"/><path d="M60 6 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z" fill="#FFE08A" stroke="#3B2A4A" stroke-width="3" stroke-linejoin="round"/><path d="M38 52 H82 M38 68 H82 M38 84 H64" stroke="#3B2A4A" stroke-width="5" stroke-linecap="round"/></svg>';

function renderCourses(){
  const fin=[];D.courses.forEach((r,ri)=>r.items.forEach((it,ii)=>{if(S.fini[ri+'-'+ii])fin.push({k:ri+'-'+ii,t:it})}));
  let c='<button class="cta" id="openSheet">'+SPARK+'<span><b>Nouveau menu</b><small>Préparer les prochains jours avec Claude</small></span><i>›</i></button>';
  c+='<div class="card racheter"><h3 class="sec">À racheter ('+(fin.length+S.extra.length)+')</h3>';
  if(!fin.length&&!S.extra.length)c+='<p class="empty">Rien pour l’instant. Touche « Fini » sur un produit de la liste, ou ajoute-le ici.</p>';
  c+='<ul>'+fin.map(x=>'<li><span>'+esc(x.t)+'</span><button class="x" data-unfini="'+x.k+'" aria-label="Retirer">×</button></li>').join('')+S.extra.map((t,n)=>'<li><span>'+esc(t)+'</span><button class="x" data-unextra="'+n+'" aria-label="Retirer">×</button></li>').join('')+'</ul>';
  c+='<div class="add"><input id="newItem" placeholder="Ajouter (ex. huile d’olive)"><button class="btn" id="addBtn">Ajouter</button></div>';
  c+='<div class="row"><button class="btn" id="shareBtn">Partager la liste</button><button class="btn" id="clearBtn">Vider</button></div></div>';
  let tot=0,pris=0;D.courses.forEach((r,ri)=>r.items.forEach((it,ii)=>{tot++;if(S.pris[ri+'-'+ii])pris++}));
  c+='<h3 class="sec" style="margin-top:4px">Liste du drive<span class="count">'+pris+'/'+tot+' pris</span></h3>';
  c+='<p class="howto"><b>Case</b> : c’est dans le panier ou à la maison.<br><b>Fini</b> : il n’y en a plus à la maison, ça part dans « À racheter ».</p>';
  D.courses.forEach((r,ri)=>{c+='<div class="card"><h3 class="sec">'+esc(r.rayon)+'</h3><ul class="check">';r.items.forEach((it,ii)=>{const k=ri+'-'+ii;c+='<li class="'+(S.pris[k]?'done':'')+'"><input type="checkbox" data-k="'+k+'" aria-label="Pris : '+esc(it)+'"'+(S.pris[k]?' checked':'')+'><span>'+esc(it)+'</span><button class="fini'+(S.fini[k]?' on':'')+'" data-fini="'+k+'">'+(S.fini[k]?'À racheter':'Fini')+'</button></li>'});c+='</ul></div>'});
  c+='<button class="reset" id="reset">Tout décocher</button>';
  vc.innerHTML=c;
}
const vc=document.getElementById('v-courses');
vc.addEventListener('change',e=>{const k=e.target.dataset.k;if(!k)return;S.pris[k]=e.target.checked;save();renderCourses()});
vc.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='openSheet'){openSheet()}
  else if(b.dataset.fini){const k=b.dataset.fini;S.fini[k]=!S.fini[k];save();renderCourses();if(S.fini[k])toast('Ajouté à « À racheter »')}
  else if(b.dataset.unfini){delete S.fini[b.dataset.unfini];save();renderCourses()}
  else if(b.dataset.unextra){S.extra.splice(+b.dataset.unextra,1);save();renderCourses()}
  else if(b.id==='addBtn'){const v=document.getElementById('newItem').value.trim();if(!v){toast('Écris un produit d’abord');return}S.extra.push(v);save();renderCourses()}
  else if(b.id==='clearBtn'){S.fini={};S.extra=[];save();renderCourses()}
  else if(b.id==='reset'){S.pris={};save();renderCourses()}
  else if(b.id==='shareBtn'){const items=listeRachat();
    if(!items.length){toast('La liste est vide');return}
    const txt='À racheter :\n- '+items.join('\n- ');
    try{if(navigator.share){await navigator.share({title:'À racheter',text:txt})}else{await navigator.clipboard.writeText(txt);toast('Liste copiée')}}catch(err){try{await navigator.clipboard.writeText(txt);toast('Liste copiée')}catch(e2){}}}
});
vc.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newItem')document.getElementById('addBtn').click()});

// ---- Page « Nouveau menu »
const TAGS=['Plus de poisson','Un soir végé','Rapide en semaine','Plats à congeler','Plats que la petite aime','Nouvelles recettes'];
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const plusJ=n=>{const d=new Date();d.setDate(d.getDate()+n);return isoD(d)};
const lundi=()=>{const d=new Date();d.setDate(d.getDate()+((8-d.getDay())%7||7));return isoD(d)};
const joli=v=>new Date(v+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
let P=null,autreDate=false;
const sheet=document.getElementById('sheet'),sIn=document.getElementById('sheetIn');
const saveP=()=>{S.params=JSON.parse(JSON.stringify(P));save()};
function renderSheet(){
  const dates=[['Aujourd’hui',plusJ(0)],['Demain',plusJ(1)],['Lundi prochain',lundi()]];
  const known=dates.some(x=>x[1]===P.debut);
  const items=listeRachat(),cuis=dejaCuisine();
  let h='<div class="sheet-top"><button class="back" id="closeSheet" aria-label="Fermer">‹</button><h2>Nouveau menu</h2></div>';
  h+='<div class="field duo"><div><p>Personnes</p><div class="stepper"><button data-step="pers" data-d="-1" aria-label="Moins">−</button><output>'+P.pers+'</output><button data-step="pers" data-d="1" aria-label="Plus">+</button></div></div>'+
     '<div><p>Jours</p><div class="stepper"><button data-step="jours" data-d="-1" aria-label="Moins">−</button><output>'+P.jours+'</output><button data-step="jours" data-d="1" aria-label="Plus">+</button></div></div></div>';
  h+='<div class="field"><p>On commence <small>· '+esc(joli(P.debut))+'</small></p><div class="chips">'+dates.map(x=>'<button class="chip'+(x[1]===P.debut&&!autreDate?' on':'')+'" data-date="'+x[1]+'">'+x[0]+'</button>').join('')+
     '<button class="chip'+(autreDate||!known?' on':'')+'" data-date="autre">Autre date</button></div>'+((autreDate||!known)?'<input type="date" class="datein" id="sDate" value="'+esc(P.debut)+'">':'')+'</div>';
  h+='<div class="field"><p>Budget produits frais <small>· hors eau, lait, épicerie</small></p><div class="stepper"><button data-step="budget" data-d="-10" aria-label="Moins 10 €">−</button><output>'+P.budget+' €</output><button data-step="budget" data-d="10" aria-label="Plus 10 €">+</button></div></div>';
  h+='<div class="field"><button class="switch'+(P.restes?' on':'')+'" id="sRestes" role="switch" aria-checked="'+P.restes+'"><span>Restes pour un midi adulte en semaine</span><i></i></button></div>';
  h+='<div class="field"><p>Envies</p><div class="chips">'+TAGS.map(t=>'<button class="chip'+(P.tags.includes(t)?' on':'')+'" data-tag="'+esc(t)+'">'+esc(t)+'</button>').join('')+'</div>'+
     '<textarea id="sEnvies" rows="2" placeholder="Autre envie, ou à éviter (ex. pas de riz)" style="margin-top:10px">'+esc(P.envies)+'</textarea></div>';
  h+='<div class="field"><p>Absences, repas dehors</p><textarea id="sAbs" rows="2" placeholder="ex. absents le week-end du 14">'+esc(P.abs)+'</textarea></div>';
  h+='<div class="field recap"><b>Claude reçoit aussi :</b><br>• À racheter ('+items.length+') : '+(items.length?esc(items.join(', ')):'rien')+'<br>• Déjà cuisiné ('+cuis.length+') : '+(cuis.length?esc(cuis.join(', ')):'rien')+'</div>';
  h+='<div class="sheet-bot"><button class="big" id="genBtn">Demander à Claude</button><button class="btn" id="genCopy">Copier</button></div>';
  sIn.innerHTML=h;
}
function openSheet(){
  P=Object.assign({pers:3,jours:10,debut:'',budget:150,restes:true,abs:'',envies:'',tags:[]},S.params||{});
  if(!Array.isArray(P.tags))P.tags=[];
  if(!P.debut||P.debut<plusJ(0))P.debut=plusJ(1);
  autreDate=false;renderSheet();sheet.classList.add('open');sheet.scrollTop=0;document.body.style.overflow='hidden';
  history.pushState({sheet:1},'');
}
function closeSheet(fromPop){sheet.classList.remove('open');document.body.style.overflow='';if(!fromPop&&history.state&&history.state.sheet)history.back();renderCourses()}
window.addEventListener('popstate',()=>{if(sheet.classList.contains('open'))closeSheet(true)});
const demande=()=>{const items=listeRachat(),cuis=dejaCuisine();
  const env=P.tags.concat(P.envies?[P.envies]:[]);
  return 'Nouveau menu pour la maison (projet Maison, drive Intermarché Marquette-lez-Lille).\n'+
  '- Personnes : '+P.pers+'\n- Durée : '+P.jours+' jours à partir du '+joli(P.debut)+'\n- Budget frais : '+P.budget+' € (eau, lait et épicerie à part)\n'+
  (P.restes?'- Midis en semaine : restes pour 1 adulte\n':'')+(P.abs?'- Absences : '+P.abs+'\n':'')+(env.length?'- Envies / à éviter : '+env.join(' ; ')+'\n':'')+
  '\nÀ racheter (plus à la maison) : '+(items.length?items.join(', '):'rien de noté')+
  '\nDéjà cuisiné cette période : '+(cuis.length?cuis.join(', '):'—')+
  '\n\nMêmes règles que d’habitude : prix au kilo, promos, marques Intermarché OK, pas de discount. Remplis le panier drive et mets à jour data.js de l’app.'};
sheet.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='closeSheet'){closeSheet();return}
  if(b.dataset.step){const k=b.dataset.step,min=k==='budget'?0:1;P[k]=Math.max(min,(+P[k]||0)+(+b.dataset.d));}
  else if(b.dataset.date){if(b.dataset.date==='autre'){autreDate=true}else{autreDate=false;P.debut=b.dataset.date}}
  else if(b.dataset.tag){const t=b.dataset.tag;P.tags=P.tags.includes(t)?P.tags.filter(x=>x!==t):P.tags.concat(t)}
  else if(b.id==='sRestes'){P.restes=!P.restes}
  else if(b.id==='genBtn'){saveP();window.open('https://claude.ai/new?q='+encodeURIComponent(demande()),'_blank');return}
  else if(b.id==='genCopy'){saveP();try{await navigator.clipboard.writeText(demande());toast('Demande copiée')}catch(err){toast('Copie impossible')}return}
  else return;
  saveP();renderSheet();
});
sheet.addEventListener('input',e=>{if(e.target.id==='sEnvies')P.envies=e.target.value;else if(e.target.id==='sAbs')P.abs=e.target.value;else return;saveP()});
sheet.addEventListener('change',e=>{if(e.target.id==='sDate'&&e.target.value){P.debut=e.target.value;saveP();renderSheet()}});

let bb='';D.penseBete.forEach((p,i)=>{bb+='<div class="card"><div class="head">'+svg(i===0?'ice':'egg')+'<h2>'+esc(p.titre)+'</h2></div><ul class="plain">'+p.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'});
document.getElementById('v-bete').innerHTML=bb;

renderMenus();renderCourses();
document.querySelectorAll('nav button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===btn));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+btn.dataset.v));window.scrollTo(0,0)});
if(first!==null&&first>0)setTimeout(()=>document.getElementById('d'+first).scrollIntoView({block:'start'}),50);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAGyeKLg5WdhMSB5dn_phmJ95PjggnyVxY",
  authDomain: "menus-maison-9efcf.firebaseapp.com",
  projectId: "menus-maison-9efcf",
  storageBucket: "menus-maison-9efcf.firebasestorage.app",
  messagingSenderId: "11264621459",
  appId: "1:11264621459:web:85a3c65364316ddc854666"
};
const status = (t, cls) => { const el = document.getElementById('sync'); el.textContent = t; el.className = 'sync ' + (cls || ''); };
// Le code maison vient du lien (#m=...) ou de la saisie, puis reste sur le téléphone. Il n'est jamais dans le dépôt.
const m = new URLSearchParams(location.hash.slice(1)).get('m');
if (m) { try { localStorage.setItem('maison', m) } catch (e) {} history.replaceState(null, '', location.pathname); }
let code = null; try { code = localStorage.getItem('maison') } catch (e) {}
const card = document.getElementById('codeCard');
document.getElementById('codeBtn').onclick = () => { const v = document.getElementById('codeInput').value.trim(); if (!v) return; try { localStorage.setItem('maison', v) } catch (e) {} location.reload(); };
if (!code) { card.style.display = 'block'; status('Pas synchronisé : code maison manquant', 'ko'); }
else {
  const db = getFirestore(initializeApp(firebaseConfig));
  const ref = doc(db, 'maisons', code, 'etat', window.SYNC_KEY.replace(/[\/]/g, '-'));
  let timer = null, first = true;
  window.syncSave = S => { clearTimeout(timer); timer = setTimeout(() => setDoc(ref, JSON.parse(JSON.stringify(S))).then(() => status('Synchronisé ✓', 'ok')).catch(() => status('Hors ligne : sera envoyé plus tard', 'ko')), 400); };
  onSnapshot(ref, snap => {
    if (snap.exists()) window.applyRemote(snap.data());
    else if (first) window.syncSave(window.getState());
    first = false; status('Synchronisé ✓', 'ok');
  }, () => { status('Code maison refusé ou hors ligne', 'ko'); card.style.display = 'block'; });
}
</script>
